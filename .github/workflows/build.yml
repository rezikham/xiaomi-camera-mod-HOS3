name: Build Module

on:
  push:
    branches: [ main, hyperos3-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
        ndk-version: r26c

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build cameramod module
      run: ./gradlew :cameramod:assembleRelease

    - name: Build app module (HyperFilmFilters)
      run: ./gradlew :app:assembleRelease

    - name: Upload cameramod APK
      uses: actions/upload-artifact@v4
      with:
        name: cameramod-release
        path: cameramod/build/outputs/apk/release/*.apk

    - name: Upload app APK
      uses: actions/upload-artifact@v4
      with:
        name: hyperfilters-release
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cameramod/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}