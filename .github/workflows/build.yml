name: Build Module

on:
  push:
    branches: [ main, hyperos3-* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
        ndk-version: r26c

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build cameramod module
      run: ./gradlew :cameramod:assembleRelease

    - name: Build app module (HyperFilmFilters)
      run: ./gradlew :app:assembleRelease

    - name: Get version info
      id: version
      run: |
        # Extract version from gradle.properties or use commit hash
        VERSION=$(grep -E '^version=' cameramod/gradle.properties 2>/dev/null | cut -d'=' -f2 || echo "")
        if [ -z "$VERSION" ]; then
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Upload cameramod APK
      uses: actions/upload-artifact@v4
      with:
        name: cameramod-release
        path: cameramod/build/outputs/apk/release/*.apk

    - name: Upload app APK
      uses: actions/upload-artifact@v4
      with:
        name: hyperfilters-release
        path: app/build/outputs/apk/release/*.apk

    - name: Create/Update "latest" Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hyperos3-'))
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        release_name: "Latest Build (${{ steps.version.outputs.branch }})"
        body: |
          **Latest development build from branch:** `${{ steps.version.outputs.branch }}`
          
          **Commit:** ${{ github.sha }}
          
          **Modules:**
          - `HyperCameraMod` (cameramod) - Enables Palette/Parameters, Original style, Leica Essential mode
          - `HyperFilmFilters` (app) - Adds R600, P100F, F-50, KC64, KP160 film filters
          
          **Installation:**
          1. Install APK via Magisk/LSPosed/Vector
          2. Enable in manager with scope: `com.android.camera`
          3. Force-stop Camera app and reopen
          
          **Features enabled:**
          - ✅ Palette & Parameters panel
          - ✅ Original colour style
          - ✅ Leica Essential mode in standard UI
          - ✅ Film filters (R600, P100F, F-50, KC64, KP160)
          - ✅ CMOS (M10R) entry (enable via `setprop camera.feature.m10r 1`)
        draft: false
        prerelease: true
        make_latest: true
        files: |
          cameramod/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Versioned Release (on tags)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: "Release ${{ github.ref_name }}"
        body: |
          **Release:** ${{ github.ref_name }}
          
          **Commit:** ${{ github.sha }}
          
          **Modules:**
          - `HyperCameraMod` (cameramod) - Enables Palette/Parameters, Original style, Leica Essential mode
          - `HyperFilmFilters` (app) - Adds R600, P100F, F-50, KC64, KP160 film filters
          
          **Installation:**
          1. Install APK via Magisk/LSPosed/Vector
          2. Enable in manager with scope: `com.android.camera`
          3. Force-stop Camera app and reopen
          
          **Features:**
          - ✅ Palette & Parameters panel
          - ✅ Original colour style
          - ✅ Leica Essential mode in standard UI
          - ✅ Film filters (R600, P100F, F-50, KC64, KP160)
          - ✅ CMOS (M10R) entry (enable via `setprop camera.feature.m10r 1`)
        draft: false
        prerelease: false
        make_latest: true
        files: |
          cameramod/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}