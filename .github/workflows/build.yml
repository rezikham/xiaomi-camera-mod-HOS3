name: Build Module

on:
  push:
    branches: [ main, hyperos3-* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
        ndk-version: r26c
        packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmdline-tools;latest platform-tools'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Calculate version from CI run number
      id: calc_version
      run: |
        BASE_VERSION_CAMERAMOD="1.0.9"
        BASE_VERSIONCODE_CAMERAMOD=11
        BASE_VERSION_FILTERS="1.9.2"
        BASE_VERSIONCODE_FILTERS=49
        CI_NUM=${{ github.run_number }}
        
        # versionName: 1.0.9-19, versionCode: 1119 (base*100 + run_number)
        VERSION_NAME_CAMERAMOD="${BASE_VERSION_CAMERAMOD}-${CI_NUM}"
        VERSION_CODE_CAMERAMOD=$((BASE_VERSIONCODE_CAMERAMOD * 100 + CI_NUM))
        VERSION_NAME_FILTERS="${BASE_VERSION_FILTERS}-${CI_NUM}"
        VERSION_CODE_FILTERS=$((BASE_VERSIONCODE_FILTERS * 100 + CI_NUM))
        
        echo "version_name_cameramod=$VERSION_NAME_CAMERAMOD" >> $GITHUB_OUTPUT
        echo "version_code_cameramod=$VERSION_CODE_CAMERAMOD" >> $GITHUB_OUTPUT
        echo "version_name_filters=$VERSION_NAME_FILTERS" >> $GITHUB_OUTPUT
        echo "version_code_filters=$VERSION_CODE_FILTERS" >> $GITHUB_OUTPUT
        echo "ci_num=$CI_NUM" >> $GITHUB_OUTPUT

    - name: Build cameramod module
      run: ./gradlew :cameramod:assembleRelease --no-daemon -PversionName=${{ steps.calc_version.outputs.version_name_cameramod }} -PversionCode=${{ steps.calc_version.outputs.version_code_cameramod }}

    - name: Build app module (HyperFilmFilters)
      run: ./gradlew :app:assembleRelease --no-daemon -PversionName=${{ steps.calc_version.outputs.version_name_filters }} -PversionCode=${{ steps.calc_version.outputs.version_code_filters }}

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep -E '^version=' cameramod/gradle.properties 2>/dev/null | cut -d'=' -f2 || echo "")
        if [ -z "$VERSION" ]; then
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Rename APKs with version (includes CI run number)
      run: |
        VERSION_CAMERAMOD=${{ steps.calc_version.outputs.version_name_cameramod }}
        VERSION_FILTERS=${{ steps.calc_version.outputs.version_name_filters }}
        # cameramod: io.rezikham.hypercameramod
        find cameramod/build/outputs/apk/release -name "*.apk" | while read f; do
          mv "$f" "$(dirname "$f")/io.rezikham.hypercameramod-${VERSION_CAMERAMOD}.apk"
        done
        # app: io.rezikham.hyperfilters
        find app/build/outputs/apk/release -name "*.apk" | while read f; do
          mv "$f" "$(dirname "$f")/io.rezikham.hyperfilters-${VERSION_FILTERS}.apk"
        done

    - name: Upload cameramod APK
      uses: actions/upload-artifact@v4
      with:
        name: hypercameramod-${{ steps.calc_version.outputs.version_name_cameramod }}
        path: cameramod/build/outputs/apk/release/io.rezikham.hypercameramod-${{ steps.calc_version.outputs.version_name_cameramod }}.apk

    - name: Upload app APK
      uses: actions/upload-artifact@v4
      with:
        name: hyperfilters-${{ steps.calc_version.outputs.version_name_filters }}
        path: app/build/outputs/apk/release/io.rezikham.hyperfilters-${{ steps.calc_version.outputs.version_name_filters }}.apk

    - name: Clean old assets from CI-Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hyperos3-'))
      run: |
        # Delete old assets from CI-Release tag
        gh release delete CI-Release --yes --cleanup-tag 2>/dev/null || true
        # Create empty release to reset
        gh release create CI-Release --title "CI-Release (placeholder)" --notes "Cleaning up..." --draft 2>/dev/null || true
        gh release delete CI-Release --yes --cleanup-tag 2>/dev/null || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - name: Create "CI-Release" (development builds)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hyperos3-'))
      uses: softprops/action-gh-release@v1
      with:
        tag_name: CI-Release
        release_name: "CI-Release (${{ steps.version.outputs.branch }} #${{ github.run_number }})"
        body: |
          **Development build from branch:** `${{ steps.version.outputs.branch }}`
          
          **CI Run:** #${{ github.run_number }}
          
          **Commit:** ${{ github.sha }}
          
          **Modules:**
          - `HyperCameraMod` (cameramod) - Enables Palette/Parameters, Original style, Leica Essential mode
          - `HyperFilmFilters` (app) - Adds R600, P100F, F-50, KC64, KP160 film filters
          
          **Installation:**
          1. Install APK via Magisk/LSPosed/Vector
          2. Enable in manager with scope: `com.android.camera`
          3. Force-stop Camera app and reopen
          
          **Features enabled:**
          - ✅ Palette & Parameters panel
          - ✅ Original colour style
          - ✅ Leica Essential mode in standard UI
          - ✅ Film filters (R600, P100F, F-50, KC64, KP160)
          - ✅ CMOS (M10R) entry (enable via `setprop camera.feature.m10r 1`)
        draft: false
        prerelease: true
        make_latest: false
        files: |
          cameramod/build/outputs/apk/release/io.rezikham.hypercameramod-${{ steps.calc_version.outputs.version_name_cameramod }}.apk
          app/build/outputs/apk/release/io.rezikham.hyperfilters-${{ steps.calc_version.outputs.version_name_filters }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Versioned Release (stable builds only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: "Release ${{ github.ref_name }}"
        body: |
          **Release:** ${{ github.ref_name }}
          
          **Commit:** ${{ github.sha }}
          
          **Modules:**
          - `HyperCameraMod` (cameramod) - Enables Palette/Parameters, Original style, Leica Essential mode
          - `HyperFilmFilters` (app) - Adds R600, P100F, F-50, KC64, KP160 film filters
          
          **Installation:**
          1. Install APK via Magisk/LSPosed/Vector
          2. Enable in manager with scope: `com.android.camera`
          3. Force-stop Camera app and reopen
          
          **Features:**
          - ✅ Palette & Parameters panel
          - ✅ Original colour style
          - ✅ Leica Essential mode in standard UI
          - ✅ Film filters (R600, P100F, F-50, KC64, KP160)
          - ✅ CMOS (M10R) entry (enable via `setprop camera.feature.m10r 1`)
        draft: false
        prerelease: false
        make_latest: true
        files: |
          cameramod/build/outputs/apk/release/io.rezikham.hypercameramod-${{ steps.calc_version.outputs.version_name_cameramod }}.apk
          app/build/outputs/apk/release/io.rezikham.hyperfilters-${{ steps.calc_version.outputs.version_name_filters }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}