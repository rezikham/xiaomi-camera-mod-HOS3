name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, hyperos3-* ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Run lint
      run: ./gradlew :cameramod:lint :app:lint

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Run tests
      run: ./gradlew :cameramod:test :app:test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build all modules
      run: ./gradlew assembleRelease
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-apks
        path: |
          cameramod/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/*.apk