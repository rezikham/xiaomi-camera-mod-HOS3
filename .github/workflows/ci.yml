name: CI - Pull Request Validation & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          build-tools: '37.0.0'
          cmdline-tools: 'latest'
          ndk-version: 'r27c'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build all modules (compile only)
        run: |
          ./gradlew :app:compileReleaseJavaWithJavac :cameramod:compileReleaseJavaWithJavac --no-daemon

      - name: Build release APKs
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload cameramod APK (artifact for rollback)
        uses: actions/upload-artifact@v4
        with:
          name: cameramod-release-apk
          path: cameramod/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload app APK (artifact for rollback)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create/Update CI-Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CAMERAMOD_APK=$(find cameramod/build/outputs/apk/release -name "*.apk" | head -1)
          APP_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          echo "Found cameramod APK: $CAMERAMOD_APK"
          echo "Found app APK: $APP_APK"

          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | sed ':a;N;$!ba;s/\n/\\n/g')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Create release notes using echo commands (avoid YAML list parsing issues)
          {
            echo "## CI Build ${COMMIT_SHA}"
            echo ""
            echo "**Date:** ${BUILD_DATE}"
            echo "**Commit:** ${COMMIT_SHA}"
            echo "**Message:** ${COMMIT_MSG}"
            echo ""
            echo "### APKs"
            echo "- HyperCameraMod (\`io.martin.hypercameramod\`) - All-in-one module with Palette/Parameters, Original style, Leica Essential, CMOS (M10R), Film filters, Settings app"
            echo "- HyperFilmFilters (\`io.martin.hyperfilters\`) - Standalone film filters module"
            echo ""
            echo "### Installation"
            echo "1. Download the desired APK"
            echo "2. Install via ADB: \`adb install -r <apk>\`"
            echo "3. Enable in LSPosed/Vector (scope: \`com.android.camera\` only)"
            echo "4. Force stop Camera app and reopen"
            echo ""
            echo "### Changelog"
            echo "See commit history for details."
          } > release_notes.md

          if git rev-parse "CI-Release" >/dev/null 2>&1; then
            echo "CI-Release tag exists, updating release..."
            gh release delete "CI-Release" --yes || true
          else
            echo "CI-Release tag does not exist, will create new..."
          fi

          git tag -f "CI-Release"
          git push -f origin "CI-Release"

          gh release create "CI-Release" \
            "$CAMERAMOD_APK" \
            "$APP_APK" \
            --title "CI Build ${COMMIT_SHA}" \
            --notes-file release_notes.md \
            --latest=false
